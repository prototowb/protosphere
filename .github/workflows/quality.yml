name: Quality

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # `vue-tsc -b` (build mode) — the root tsconfig.json is references-only
      # (`files: []`), so `vue-tsc --noEmit` against it checks zero files.
      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:run
