name: Build Dist

on:
  push:
    branches:
      - development
  pull_request_target:
    types: [closed]
    branches:
      - main

concurrency:
  group: build-dist-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dist:
    if: |
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    env:
      # development branch → staging credentials; main branch → production credentials
      VITE_SUPABASE_URL: ${{ github.ref_name == 'development' && (secrets.VITE_SUPABASE_URL_STAGING || vars.VITE_SUPABASE_URL_STAGING) || (secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL) }}
      VITE_SUPABASE_ANON_KEY: ${{ github.ref_name == 'development' && (secrets.VITE_SUPABASE_ANON_KEY_STAGING || vars.VITE_SUPABASE_ANON_KEY_STAGING) || (secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify build env
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY. Set repository secrets or vars."
            exit 1
          fi

      - name: Write build env
        run: |
          cat > .env.production << EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Clean dist
        run: rm -rf dist

      - name: Build
        run: npm run build

      - name: Verify dist contains Supabase URL
        run: |
          if ! grep -R "${VITE_SUPABASE_URL}" dist/assets >/dev/null; then
            echo "Supabase URL not found in dist output."
            exit 1
          fi

      - name: Publish dist to deploy branch
        env:
          DEPLOY_BRANCH: dist-${{ github.base_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b "$DEPLOY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build($DEPLOY_BRANCH): from ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$DEPLOY_BRANCH"
